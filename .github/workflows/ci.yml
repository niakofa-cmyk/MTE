name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mte_test
          POSTGRES_PASSWORD: mte_test
          POSTGRES_DB: mte_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mte_test -d mte_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://mte_test:mte_test@localhost:5432/mte_test
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint game source
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Prepare test database schema
        run: pnpm --filter @workspace/db run push

      - name: Run tests
        run: pnpm run test

      - name: Build workspace
        run: pnpm run build
        env:
          PORT: 24153
          BASE_PATH: /
